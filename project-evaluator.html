<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="project-evaluator.css">
    <title>Project Evaluator</title>
</head>

<body>

    <header>
        <h1>Project Evaluator</h1>

        <p>
            An AI-assisted decision intelligence platform that helps organizations evaluate, prioritize, and continuously 
            reassess projects by connecting financial, operational, resource, strategic, timeline, and risk information into 
            one evidence-based decision system.
        </p>
    </header>

    <main>

        <section class="evaluator">

            <h2>Evaluate a Project</h2>

            <label for="projectDescription">Problem or Need Being Addressed</label>

            <textarea
                id="projectDescription"
                rows="5"
                placeholder="What specific problem, need, or opportunity is this projects addressing?"
            ></textarea>

            <label for="startDate">Expected Start Date</label>

            <input
                id="startDate"
                type="date"
            >

            <label for="endDate">Expected End Date</label>

            <input
                id="endDate"
                type="date"
            >

            <label for="budgetInput">Project Budget</label>

            <input
                id="budgetInput"
                type="number"
                step="0.01"
                min="0"
                placeholder="Enter Project Budget"
            >

            <label for="complexityInput">Project Complexity</label>

            <select id="complexityInput">
                <option value="low">Low Complexity</option>
                <option value="medium">Medium Complexity</option>
                <option value="high">High Complexity</option>
            </select>

            <label for="riskInput">Project Risk</label>

            <select id="riskInput">
                <option value="low">Low Risk</option>
                <option value="medium">Medium Risk</option>
                <option value="high">High Risk</option>
            </select>

            <button id="budgetBtn" type="button">
                Evaluate Project
            </button>

            <div id="projectDecision"></div>

        </section>

    </main>

    <script src="project-evaluator.js"></script>

</body>

</html>
